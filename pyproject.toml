[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bots-langchain"
version = "1.0.0"
description = "API REST de bots RAG sobre Paperless-ngx con LangChain, ChromaDB, Ollama y OpenAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.14",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.20",
    "langchain-core>=0.3.0",
    "langchain-ollama>=1.0.1",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.4.22",
    "tiktoken>=0.5.2",
    "sqlalchemy>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.12.0",
    "pandas>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]
# Voz local (STT/TTS). Requiere además ffmpeg en el sistema.
voice = [
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
]

[tool.setuptools]
# Paquete de aplicación. Se mantiene "bots" como shim de compatibilidad temporal.
packages = ["app"]

[tool.pytest.ini_options]
# Por defecto solo se ejecutan los tests unitarios (offline y rápidos).
# Los tests de integración requieren servicios externos (Paperless/Ollama/OpenAI)
# y se ejecutan explícitamente con: pytest tests/integration
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
